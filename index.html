<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matrix Love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { margin: 0; height: 100%; background: #050505; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #msg { position: fixed; left: 0; right: 0; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); text-align: center;
    color: #7dff9a; font: 800 24px Tajawal, system-ui, sans-serif; direction: ltr; pointer-events: none;
    text-shadow: 0 0 6px rgba(77,255,122,.35); }
  #msg span { display: inline-block; opacity: 0; transform: translateY(-80vh);
    transition: transform 1s cubic-bezier(.35,.8,.4,1), opacity .3s; }
  #msg span.drop { opacity: 1; transform: none; }
  #msg span.gone { opacity: 0; transform: none; transition: opacity .6s; }
  button { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
    background: transparent; color: #4dff7a; border: 1px solid #4dff7a; border-radius: 999px;
    padding: 8px 22px; font: 15px Tajawal, system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"></div>
<button id="again">إعادة ↻</button>
<script>
const words = ["نحبك مرام","I love you Maram","Je t'aime Maram","Te amo Maram","Ich liebe dich Maram","Ti amo Maram",
"Eu te amo Maram","Σ' αγαπώ Maram","Я тебя люблю Maram","愛してる Maram","我爱你 Maram","사랑해 Maram",
"Seni seviyorum Maram","Aku cinta kamu Maram","Anh yêu em Maram","Ik hou van jou Maram","Jag älskar dig Maram",
"Kocham cię Maram","मैं तुमसे प्यार करता हूँ Maram","ฉันรักเธอ Maram","Я тебе кохаю Maram","Ég elska þig Maram",
"دوستت دارم Maram","Nakupenda Maram","Te iubesc Maram","Miluji tě Maram","Szeretlek Maram","Rakastan sinua Maram",
"Jeg elsker deg Maram","Mahal kita Maram","Të dua Maram","আমি তোমাকে ভালোবাসি Maram"];
const chars = Array.from(new Set(words.join('').replace(/\s/g, ''))).concat(['♥']);
let pool = chars;
const rnd = () => pool[Math.floor(Math.random() * pool.length)];
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), msg = document.getElementById('msg');
let cols, rows, cs, ch, br, lk, mask, heads, t0, last, raf, dropped, cleared, tm, K = 1, txtCv = null;
const TEXT_LINES = ["im obsessed", "with you 😍"];
const textChars = Array.from(new Set(TEXT_LINES.join('').replace(/[^a-z]/g, '')));
const FONT = 'Tajawal, system-ui, "Noto Sans", "Noto Naskh Arabic", sans-serif';
const LOCK_AFTER = 1500, SPAWN_END = 10000;
const MSG_TEXT = "I love you Maram 💗";

// تحميل الخط مسبقاً
try {
  document.fonts.load('800 40px Tajawal', 'im obsessed with you');
  document.fonts.load('800 24px Tajawal', 'I love you Maram');
} catch (e) {}

function buildMsg() {
  msg.innerHTML = '';
  Array.from(MSG_TEXT).forEach((g, i) => {
    const s = document.createElement('span');
    s.textContent = g === ' ' ? '\u00a0' : g;
    s.style.transitionDelay = (i * 0.14) + 's, ' + (i * 0.14) + 's';
    msg.appendChild(s);
  });
}

function buildTextMask() {
  const SS = 3, oc = document.createElement('canvas');
  oc.width = cols * SS; oc.height = rows * SS;
  const o = oc.getContext('2d', { willReadFrequently: true });
  o.font = `800 100px ${FONT}`;
  const maxw = Math.max(...TEXT_LINES.map(l => o.measureText(l).width));
  const f = Math.min(100 * oc.width * 0.58 / maxw, oc.height * 0.085);
  o.font = `800 ${f}px ${FONT}`;
  o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = '#9dffb5';
  const lh = f * 1.5, y0 = oc.height / 2 - (TEXT_LINES.length - 1) * lh / 2;
  TEXT_LINES.forEach((l, k) => o.fillText(l, oc.width / 2, y0 + k * lh));
  const d = o.getImageData(0, 0, oc.width, oc.height).data;
  for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
    let n = 0;
    for (let x = 0; x < SS; x++) for (let y = 0; y < SS; y++)
      if (d[((r * SS + y) * oc.width + c * SS + x) * 4 + 3] > 100) n++;
    mask[c * rows + r] = n >= 4 ? 1 : 0;
  }
  txtCv = oc;
}

function startText() {
  setup(1); t0 = performance.now();
}

function setup(mode) {
  K = mode ? 4 : 1;
  pool = mode ? textChars : chars;
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cs = mode ? Math.max(4.5, Math.min(6, W / 70)) : Math.max(12, Math.min(20, W / 26));
  cols = Math.ceil(W / cs); rows = Math.ceil(H / cs);
  const n = cols * rows;
  ch = new Array(n).fill('♥'); br = new Float32Array(n); lk = new Uint8Array(n); mask = new Uint8Array(n);
  const s = Math.min(W / 2.5, H / 2.9), cx = W / 2, cy = H / 2 + 0.1 * s;
  if (!mode) for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
    const u = (c * cs + cs / 2 - cx) / s, v = (cy - (r * cs + cs / 2)) / s;
    mask[c * rows + r] = Math.pow(u*u + v*v - 1, 3) - u*u*v*v*v <= 0 ? 1 : 0;
  }
  if (mode) buildTextMask();
  heads = Array.from({ length: cols }, () => ({ y: -Math.random() * rows, v: (12 + Math.random() * 14) * K, on: true }));
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000), el = now - t0; last = now;
  for (let c = 0; c < cols; c++) {
    const h = heads[c];
    if (!h.on) continue;
    const prev = Math.floor(h.y); h.y += h.v * dt;
    for (let r = prev + 1; r <= Math.floor(h.y); r++) {
      if (r < 0 || r >= rows) continue;
      const i = c * rows + r; br[i] = 1; ch[i] = rnd();
      if (mask[i] && el > LOCK_AFTER) lk[i] = 1;
    }
    if (h.y > rows + 2) {
      // في المرحلة الثانية المطر يبقى يهبط على طول
      if (K > 1 || el < SPAWN_END) { h.y = -Math.random() * rows * 0.6; h.v = (12 + Math.random() * 14) * K; } else h.on = false;
    }
  }
  if (el > 9000 && !dropped) {
    dropped = true;
    msg.querySelectorAll('span').forEach(s => s.classList.add('drop'));
  }
  if (dropped && !cleared && el > 9000 + MSG_TEXT.length * 140 + 1000 + 3000) {
    cleared = true;
    heads.forEach(h => h.on = false);
    for (let i = 0; i < lk.length; i++) if (lk[i]) { lk[i] = 0; br[i] = 1; }
    msg.querySelectorAll('span').forEach(s => { s.style.transitionDelay = '0s'; s.classList.add('gone'); });
    tm = setTimeout(startText, 1100);
  }
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  ctx.font = `700 ${cs * 0.85}px system-ui, "Noto Sans", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.direction = 'ltr';
  const pulse = 0.75 + 0.25 * Math.abs(Math.sin(now / 450));
  for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
    const i = c * rows + r;
    if (lk[i]) {
      if (Math.random() < 0.004) ch[i] = rnd();
      ctx.fillStyle = `hsla(135, 90%, 55%, ${pulse})`;
    } else {
      br[i] = Math.max(0, br[i] - dt * 1.1);
      if (br[i] < 0.03) continue;
      ctx.fillStyle = br[i] > 0.92 ? '#e6ffec' : `hsla(135, 85%, 45%, ${br[i]})`;
    }
    ctx.fillText(ch[i], c * cs + cs / 2, r * cs + cs / 2);
  }
  if (K > 1 && txtCv) {
    const a = Math.min(1, Math.max(0, (el - 5500) / 1500));
    if (a > 0) {
      ctx.globalAlpha = a * 0.7; ctx.shadowColor = '#4dff7a'; ctx.shadowBlur = 3;
      ctx.drawImage(txtCv, 0, 0, cols * cs, rows * cs);
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    }
  }
  raf = requestAnimationFrame(frame);
}

function play() {
  cancelAnimationFrame(raf); clearTimeout(tm); setup(0); buildMsg(); dropped = cleared = false;
  t0 = last = performance.now(); raf = requestAnimationFrame(frame);
}
document.getElementById('again').onclick = play;
addEventListener('resize', play);
play();
</script>
</body>
</html>
